<!DOCTYPE html>
<html lang="tg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Калькулятор</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #111827, #1e3a8a);
}

.calculator {
    width: 340px;
    padding: 20px;
    border-radius: 30px;
    background: #151515;
    box-shadow: 0 20px 50px rgba(0,0,0,.6);
}

.title {
    color: white;
    text-align: center;
    font-size: 24px;
    margin-bottom: 15px;
    font-weight: bold;
}

#display {
    width: 100%;
    height: 80px;
    border: none;
    outline: none;
    border-radius: 18px;
    margin-bottom: 15px;
    padding: 10px 15px;
    background: #292929;
    color: white;
    font-size: 32px;
    text-align: right;
}

.buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
}

button {
    height: 62px;
    border: none;
    border-radius: 18px;
    background: #303030;
    color: white;
    font-size: 22px;
    font-weight: bold;
    cursor: pointer;
    transition: .1s;
}

button:active {
    transform: scale(.92);
}

.operator {
    background: #2563eb;
}

.equal {
    background: #16a34a;
}

.clear {
    background: #dc2626;
}

.special {
    background: #7c3aed;
}
</style>
</head>

<body>

<div class="calculator">

<div class="title">КАЛЬКУЛЯТОР</div>

<input id="display" value="0" readonly>

<div class="buttons">

<button class="clear" onclick="clearDisplay()">C</button>
<button onclick="backspace()">⌫</button>
<button class="special" onclick="add('%')">%</button>
<button class="operator" onclick="add('/')">÷</button>

<button onclick="add('7')">7</button>
<button onclick="add('8')">8</button>
<button onclick="add('9')">9</button>
<button class="operator" onclick="add('*')">×</button>

<button onclick="add('4')">4</button>
<button onclick="add('5')">5</button>
<button onclick="add('6')">6</button>
<button class="operator" onclick="add('-')">−</button>

<button onclick="add('1')">1</button>
<button onclick="add('2')">2</button>
<button onclick="add('3')">3</button>
<button class="operator" onclick="add('+')">+</button>

<button onclick="add('0')">0</button>
<button onclick="add('.')">.</button>
<button class="equal" onclick="calculate()">=</button>

</div>
</div>

<script>
    function square() {
    try {
        display.value = Math.pow(Number(display.value), 2);
    } catch {
        display.value = "Хато";
    }
}

function sqrt() {
    try {
        let number = Number(display.value);

        if (number < 0) {
            display.value = "Хато";
        } else {
            display.value = Math.sqrt(number);
        }
    } catch {
        display.value = "Хато";
    }
}
let display = document.getElementById("display");

function add(value) {
    if (display.value === "0" || display.value === "Хато") {
        display.value = value;
    } else {
        display.value += value;
    }
}

function clearDisplay() {
    display.value = "0";
}

function backspace() {
    display.value = display.value.slice(0, -1);

    if (display.value === "") {
        display.value = "0";
    }
}

function calculate() {
    try {
        let expression = display.value.replace(/%/g, "/100");
        let result = Function("return " + expression)();

        if (!isFinite(result)) {
            display.value = "Хато";
        } else {
            display.value = result;
        }
    } catch {
        display.value = "Хато";
    }
}
</script>

</body>
</html>
